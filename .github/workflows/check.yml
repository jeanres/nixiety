name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Apple Silicon runner, same system as the MacBook (aarch64-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check formatting
        run: nix fmt -- --ci

      - name: Flake check
        run: nix flake check

      - name: Build system
        run: nix build .#darwinConfigurations.Jeanres-MacBook-Pro.system --print-build-logs
